    <script>
      // Safeguard against crypto wallet extension collisions (e.g. MetaMask, Coinbase Wallet, Rabby, Phantom)
      // which throw: "Uncaught TypeError: Cannot redefine property: ethereum"
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && (prop === 'ethereum' || prop === 'web3')) {
              try {
                return originalDefineProperty.call(Object, obj, prop, Object.assign({}, descriptor, {
                  configurable: true,
                  writable: descriptor && descriptor.writable !== undefined ? descriptor.writable : true
                }));
              } catch (e) {
                console.warn('[VYNO Safeguard] Caught wallet provider redefinition conflict:', e);
                return obj;
              }
            }
            return originalDefineProperty.apply(Object, arguments);
          };
        } catch (e) {
          console.warn('[VYNO Safeguard] Could not patch Object.defineProperty:', e);
        }

        function isEthereumError(msg) {
          return typeof msg === 'string' && (
            msg.indexOf('Cannot redefine property: ethereum') !== -1 ||
            msg.indexOf('redefine property: ethereum') !== -1 ||
            msg.indexOf('Cannot redefine property: web3') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message));
          if (isEthereumError(msg)) {
            console.warn('[VYNO Safeguard] Intercepted and suppressed extension collision error:', msg);
            event.preventDefault && event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message);
          if (isEthereumError(msg)) {
            console.warn('[VYNO Safeguard] Intercepted and suppressed extension unhandled rejection:', msg);
            event.preventDefault && event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
